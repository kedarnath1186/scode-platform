<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Orbit9 Platform CMS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }

    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 14px 12px 40px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .feedback {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }

    .feedback.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .demo-credentials {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
    }

    .demo-credentials code {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1>Orbit9 Admin Portal</h1>
      <p>Single Database CMS &amp; Business Manager</p>
    </div>

    <div id="login-feedback" class="feedback"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="username">Username or Admin Email</label>
        <div class="input-wrapper">
          <i class="bi bi-person-fill"></i>
          <input type="text" id="username" class="form-control" placeholder="admin" value="admin" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="bi bi-key-fill"></i>
          <input type="password" id="password" class="form-control" placeholder="••••••••" value="admin123" required>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-submit">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
      </button>
    </form>

    <div class="demo-credentials">
      <p>Default Login: <code>admin</code> / Password: <code>admin123</code></p>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/" style="color: #64748b; font-size: 0.85rem; text-decoration: none;">
        <i class="bi bi-arrow-left"></i> Back to Main Portal
      </a>
    </div>
  </div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const feedback = document.getElementById('login-feedback');
      const submitBtn = document.getElementById('btn-submit');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Signing In...';

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('orbit9_admin_token', data.token);
          localStorage.setItem('orbit9_admin_user', JSON.stringify(data.user));
          window.location.href = '/admin';
        } else {
          feedback.className = 'feedback error';
          feedback.innerText = data.message || 'Invalid credentials';
        }
      } catch (err) {
        feedback.className = 'feedback error';
        feedback.innerText = 'Network error. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
